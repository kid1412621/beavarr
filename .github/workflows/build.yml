name: CI - Build
on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main
jobs:
    build:
        permissions:
            contents: read
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
            - name: Install dependencies
              run: bun install
            - name: Build
              run: bun run build
            - name: Test
              run: bun run test
